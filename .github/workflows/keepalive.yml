name: keepalive

# GitHub disables `schedule` triggers after 60 days without repository
# activity. This workflow keeps the timer from ever expiring and re-enables
# anything that already slipped through.

on:
  schedule:
    - cron: '40 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Keep scheduled workflows alive
    if: github.repository == 'weudlll-cyber/Frontend-mining-tycoon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Re-enable workflows disabled by inactivity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DISABLED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --paginate --jq '.workflows[] | select(.state == "disabled_inactivity") | "\(.id)\t\(.name)"')"

          if [ -z "$DISABLED" ]; then
            echo "No workflows disabled by inactivity."
            echo "- Re-enabled: none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS=$'\t' read -r id name; do
            echo "Re-enabling ${name} (${id})"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            echo "- Re-enabled: ${name}" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$DISABLED"

      - name: Refresh activity timestamp if the repo has gone quiet
        shell: bash
        run: |
          set -euo pipefail
          MAX_IDLE_DAYS=30
          LAST_COMMIT_EPOCH="$(git log -1 --format=%ct)"
          NOW_EPOCH="$(date -u +%s)"
          IDLE_DAYS=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))

          echo "Last commit was ${IDLE_DAYS} day(s) ago (threshold: ${MAX_IDLE_DAYS})."

          if [ "$IDLE_DAYS" -lt "$MAX_IDLE_DAYS" ]; then
            echo "- Keepalive commit: not needed (${IDLE_DAYS}d idle)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore(ci): keepalive to preserve scheduled workflows [skip ci]'
          git push origin HEAD:main
          echo "- Keepalive commit: pushed (${IDLE_DAYS}d idle)" >> "$GITHUB_STEP_SUMMARY"
