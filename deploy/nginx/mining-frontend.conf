# Mining Tycoon frontend: static files from the Vite build (dist/).
#
# Placeholders: __FRONTEND_DOMAIN__ (e.g. game.example.com)
#               __WEB_ROOT__        (default /var/www/mining-tycoon)
#               __API_ORIGIN__      (backend origin, e.g. https://api.example.com)
#               __API_WS_ORIGIN__   (the same host as wss://, for the chat socket)
# Installed by deploy/remote/install-frontend.sh as
# /etc/nginx/sites-available/mining-frontend.conf. TLS is added afterwards by
# `certbot --nginx -d __FRONTEND_DOMAIN__`, which edits this file in place, so
# the installer does not overwrite an existing copy unless --reset-nginx is given.
#
# Pages: /index.html (start/lobby), /player.html (game), /admin.html (round setup),
# /how-to-play.html (static player guide), /privacy.html and /imprint.html
# (static legal page templates).
# This is a multi-page app, not an SPA: unknown paths return 404.

# Privacy: access logs record the path without the query string or referrer
# (query strings can carry player ids or dev-only tickets). This file is
# included in nginx's http context, so the log format is defined here; its name
# is unique to this site.
log_format mining_frontend_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name __FRONTEND_DOMAIN__;

    access_log /var/log/nginx/mining-frontend.access.log mining_frontend_noquery;

    root __WEB_ROOT__;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: scripts and styles only from this site (no
    # inline scripts, no <style> tags, no style="" attributes; JS may still
    # set element.style), network calls only to this site and the backend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }

    # Vite build output (/assets/<name>-<hash>.js|css): content-hashed, so it can
    # be cached forever. add_header here replaces the server-level headers,
    # so they are repeated.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Other files under /assets (images copied from public/assets) keep their
    # names between releases: cache them for a week only.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML pages must always be revalidated so a deploy takes effect at once.
    # /player, /admin, /how-to-play, /privacy and /imprint also work without the .html suffix.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }
}
